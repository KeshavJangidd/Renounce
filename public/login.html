<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Renounce — Sign in</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="stylesheet" href="css/shared.css" />
    <style>
      .auth-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
      }
      .auth-heading {
        margin: 0 0 0.5rem;
        font-size: clamp(2rem, 3vw, 2.6rem);
        letter-spacing: -.03em;
      }
      .auth-copy {
        margin: 0 0 1.4rem;
        color: var(--ink-soft);
        line-height: 1.5;
      }
      .field-error {
        margin: 0.25rem 0 0;
        color: #ef4444;
        font-size: 0.82rem;
      }
      .auth-success {
        display: none;
        margin-bottom: 1rem;
        padding: .7rem .9rem;
        border-radius: 10px;
        background: rgba(72, 187, 120, .12);
        border: 1px solid rgba(72, 187, 120, .3);
        color: #166534;
        font-size: .95rem;
      }
      .auth-hint {
        margin-top: 0.8rem;
        color: var(--ink-soft);
        font-size: .88rem;
      }
      .auth-card {
        width: min(420px, 100%);
        padding: 2.2rem;
      }
      .auth-toggle {
        display: flex;
        gap: .4rem;
        margin-bottom: 1.4rem;
        padding: .3rem;
        border-radius: 12px;
        background: rgba(255,255,255,.04);
        border: 1px solid var(--line);
      }
      .auth-toggle button {
        flex: 1;
        padding: .6rem;
        border: none;
        border-radius: 9px;
        background: transparent;
        color: var(--ink-soft);
        font-weight: 700;
        cursor: pointer;
      }
      .auth-toggle button.active {
        background: var(--green-pale);
        color: var(--green);
      }
      .auth-field { display: grid; gap: .4rem; margin-bottom: 1rem; }
      .auth-error {
        display: none;
        margin-bottom: 1rem;
        padding: .7rem .9rem;
        border-radius: 10px;
        background: rgba(236,72,153,.1);
        border: 1px solid rgba(236,72,153,.3);
        color: #f0a8cf;
        font-size: .85rem;
      }
      .auth-divider {
        display: flex;
        align-items: center;
        gap: .6rem;
        margin: 1.2rem 0;
        color: var(--ink-soft);
        font-size: .78rem;
        text-transform: uppercase;
        letter-spacing: .05em;
      }
      .auth-divider::before, .auth-divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--line);
      }
      .auth-google {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: .6rem;
      }
    </style>
  </head>
  <body>
    <div class="auth-shell">
      <div class="card auth-card">
        <div class="auth-brand">
          <img class="auth-mascot" src="/images/avatar.png" alt="Renounce" />
          <div>
            <h1 class="auth-heading" id="auth-heading">Welcome back</h1>
            <p class="auth-copy" id="auth-copy">Sign in to continue, or switch to Get started to create a new account.</p>
          </div>
        </div>

        <div class="auth-toggle">
          <button type="button" id="tab-login" class="active">Log in</button>
          <button type="button" id="tab-signup">Sign up</button>
        </div>

        <p class="auth-error" id="auth-error"></p>
        <p class="auth-success" id="auth-success"></p>

        <form id="auth-form">
          <div class="auth-field" id="name-field" style="display:none;">
            <label for="name-input">Name</label>
            <input type="text" id="name-input" placeholder="What should we call you?" />
          </div>
          <div class="auth-field">
            <label for="email-input">Email</label>
            <input type="email" id="email-input" placeholder="you@school.edu" required />
            <small class="field-error" id="email-error"></small>
          </div>
          <div class="auth-field">
            <label for="password-input">Password</label>
            <input type="password" id="password-input" placeholder="••••••••" required />
            <small class="field-error" id="password-error"></small>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;" id="submit-btn">Log in</button>
        </form>

        <p class="auth-hint" id="auth-hint">Forgot your details? Just start fresh — sign up again with a different email.</p>

        <div class="auth-divider">or</div>

        <a href="#" class="btn btn-secondary auth-google" id="google-sign-in">
          Sign in with Google
        </a>
      </div>
    </div>

    <script src="js/shared.js"></script>
    <script>
      const tabLogin = document.getElementById('tab-login');
      const tabSignup = document.getElementById('tab-signup');
      const nameField = document.getElementById('name-field');
      const authHeading = document.getElementById('auth-heading');
      const authCopy = document.getElementById('auth-copy');
      const authHint = document.getElementById('auth-hint');
      const authSuccess = document.getElementById('auth-success');
      const emailError = document.getElementById('email-error');
      const passwordError = document.getElementById('password-error');
      const submitBtn = document.getElementById('submit-btn');
      const form = document.getElementById('auth-form');
      const errorEl = document.getElementById('auth-error');
      let mode = 'login';

      function clearFieldErrors() {
        emailError.textContent = '';
        passwordError.textContent = '';
      }

      function showError(message) {
        authSuccess.style.display = 'none';
        authSuccess.textContent = '';
        errorEl.textContent = message;
        errorEl.style.display = 'block';
      }

      function showSuccess(message) {
        errorEl.style.display = 'none';
        errorEl.textContent = '';
        authSuccess.textContent = message;
        authSuccess.style.display = 'block';
      }

      function setMode(next) {
        mode = next;
        tabLogin.classList.toggle('active', mode === 'login');
        tabSignup.classList.toggle('active', mode === 'signup');
        nameField.style.display = mode === 'signup' ? 'grid' : 'none';
        submitBtn.textContent = mode === 'signup' ? 'Create account' : 'Log in';
        authHeading.textContent = mode === 'signup' ? 'Get started' : 'Welcome back';
        authCopy.textContent = mode === 'signup'
          ? 'Create a new Renounce account to keep your study data private and personal.'
          : 'Sign in with your email to pick up where you left off.';
        authHint.textContent = mode === 'signup'
          ? 'Have an account? Tap Welcome back and sign in.'
          : 'Forgot your details? Just start fresh — sign up again with a different email.';
        authHint.style.display = 'block';
        errorEl.style.display = 'none';
        authSuccess.style.display = 'none';
        clearFieldErrors();
      }

      function validateInputs(email, password) {
        clearFieldErrors();
        let valid = true;
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailPattern.test(email)) {
          emailError.textContent = 'Enter a valid email address.';
          valid = false;
        }
        if (password.length < 6) {
          passwordError.textContent = 'Password must be at least 6 characters.';
          valid = false;
        }
        return valid;
      }

      tabLogin.addEventListener('click', () => setMode('login'));
      tabSignup.addEventListener('click', () => setMode('signup'));

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorEl.style.display = 'none';
        authSuccess.style.display = 'none';
        clearFieldErrors();

        const email = document.getElementById('email-input').value.trim();
        const password = document.getElementById('password-input').value.trim();
        const name = document.getElementById('name-input').value.trim();

        if (!validateInputs(email, password)) {
          return;
        }

        const endpoint = mode === 'signup' ? '/api/auth/signup' : '/api/auth/login';
        const body = mode === 'signup' ? { email, password, name } : { email, password };

        try {
          const res = await window.apiFetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });

          let data = null;
          try {
            data = await res.json();
          } catch (jsonError) {
            console.error('Could not parse JSON response:', jsonError);
          }

          if (!res.ok) {
            showError(data?.error || data?.message || `Request failed: ${res.status}`);
            console.error('Signup/login error:', res.status, data);
            return;
          }

          if (mode === 'signup') {
            showSuccess(`Welcome, ${data.name || 'there'}! Redirecting...`);
            await new Promise((resolve) => setTimeout(resolve, 500));
          }
          window.location.href = '/index.html';
        } catch (err) {
          console.error('Auth request failed:', err);
          showError(err.message || 'Network error. Try again.');
        }
      });

      setMode('login');

      const params = new URLSearchParams(window.location.search);
      if (params.get('error') === 'google') {
        showError('Google sign-in failed. Try again or use email.');
      }
    </script>
  </body>
</html>
