<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Renounce — Sign in</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
    <link rel="shortcut icon" href="/favicon.ico?v=3" />
    <link rel="stylesheet" href="css/shared.css" />
    <style>
      .auth-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }
      .auth-card {
        width: min(400px, 100%);
        padding: 2rem;
      }
      .auth-back {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        margin-bottom: 1.35rem;
        color: var(--ink-soft);
        font-size: 0.82rem;
        font-weight: 600;
      }
      .auth-back:hover {
        color: var(--accent);
      }
      .auth-back:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
        border-radius: var(--radius-sm);
      }
      .auth-heading {
        margin: 0 0 0.35rem;
        font-size: 1.45rem;
        font-family: "Manrope", sans-serif;
        font-weight: 700;
        letter-spacing: -0.03em;
        color: var(--ink);
      }
      .auth-copy {
        margin: 0 0 1.25rem;
        color: var(--ink-soft);
        font-size: 0.86rem;
        line-height: 1.5;
      }
      .field-error {
        margin: 0.25rem 0 0;
        color: #dc2626;
        font-size: 0.78rem;
      }
      [data-theme="dark"] .field-error {
        color: #f87171;
      }
      .auth-success {
        display: none;
        margin-bottom: 1rem;
        padding: 0.65rem 0.85rem;
        border-radius: var(--radius-sm);
        background: rgba(34, 197, 94, 0.08);
        border: 1px solid rgba(34, 197, 94, 0.2);
        color: #16a34a;
        font-size: 0.84rem;
      }
      [data-theme="dark"] .auth-success {
        color: #4ade80;
      }
      .auth-error {
        display: none;
        margin-bottom: 1rem;
        padding: 0.65rem 0.85rem;
        border-radius: var(--radius-sm);
        background: rgba(239, 68, 68, 0.08);
        border: 1px solid rgba(239, 68, 68, 0.2);
        color: #dc2626;
        font-size: 0.84rem;
      }
      [data-theme="dark"] .auth-error {
        color: #f87171;
      }
      .auth-hint {
        margin-top: 0.85rem;
        color: var(--ink-faint);
        font-size: 0.8rem;
        line-height: 1.45;
      }
      .auth-toggle {
        display: flex;
        gap: 0.25rem;
        margin-bottom: 1.25rem;
        padding: 0.25rem;
        border-radius: var(--radius-sm);
        background: var(--surface-subtle);
        border: 1px solid var(--line);
      }
      .auth-toggle button {
        flex: 1;
        padding: 0.45rem;
        border: none;
        border-radius: calc(var(--radius-sm) - 2px);
        background: transparent;
        color: var(--ink-soft);
        font-size: 0.82rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .auth-toggle button.active {
        background: var(--surface);
        color: var(--ink);
        box-shadow: var(--shadow-sm);
        font-weight: 600;
      }
      .auth-field {
        display: grid;
        gap: 0.35rem;
        margin-bottom: 0.95rem;
      }
      .auth-field label {
        font-size: 0.8rem;
        font-weight: 500;
        color: var(--ink-soft);
      }
      .auth-divider {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        margin: 1.1rem 0;
        color: var(--ink-faint);
        font-size: 0.74rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .auth-divider::before, .auth-divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--line);
      }
      .auth-google {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }
    </style>
  </head>
  <body>
    <div class="auth-shell">
      <div class="card auth-card">
        <a class="auth-back" href="index.html" aria-label="Back to homepage">← Back to home</a>
        <div class="auth-brand">
          <img class="auth-mascot" src="images/renounce-avatar.png" alt="Renounce mascot" />
          <div>
            <h1 class="auth-heading" id="auth-heading">Welcome back</h1>
            <p class="auth-copy" id="auth-copy">Sign in to continue, or switch to Get started to create a new account.</p>
          </div>
        </div>

        <div class="auth-toggle">
          <button type="button" id="tab-login" class="active">Log in</button>
          <button type="button" id="tab-signup">Sign up</button>
        </div>

        <p class="auth-error" id="auth-error"></p>
        <p class="auth-success" id="auth-success"></p>

        <form id="auth-form">
          <div class="auth-field" id="name-field" style="display:none;">
            <label for="name-input">Name</label>
            <input type="text" id="name-input" placeholder="What should we call you?" />
          </div>
          <div class="auth-field">
            <label for="email-input">Email</label>
            <input type="email" id="email-input" placeholder="you@school.edu" required />
            <small class="field-error" id="email-error"></small>
          </div>
          <div class="auth-field">
            <label for="password-input">Password</label>
            <input type="password" id="password-input" placeholder="••••••••" required />
            <small class="field-error" id="password-error"></small>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;" id="submit-btn">Log in</button>
        </form>

        <p class="auth-hint" id="auth-hint">Forgot your details? Just start fresh — sign up again with a different email.</p>

        <div class="auth-divider">or</div>

        <a href="/api/auth/google" class="btn btn-secondary auth-google" id="google-sign-in">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="margin-right:8px;vertical-align:middle;flex-shrink:0;">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.28v3.15C3.33 21.46 7.37 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.28C.46 8.2.01 10.05.01 12s.45 3.8 1.27 5.42l4-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.37 0 3.33 2.54 1.28 6.58l4 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
          </svg>
          Sign in with Google
        </a>
      </div>
    </div>

    <script src="js/shared.js"></script>
    <script src="js/login.js"></script>
    <script>
      (function () {})();
    </script>
  </body>
</html>
